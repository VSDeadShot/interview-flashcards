plugins {
    id 'com.android.application'
}

// The API key and the server's address are per-machine, and local.properties is gitignored.
// Reading them here is what keeps them out of the repo while still letting the app be built
// with one command. Missing values fall back to a blank key rather than failing the build,
// so a fresh clone can still run the scheduler and database tests, which need neither; the
// blank is refused loudly by ApiKeyInterceptor the moment anything tries to make a request.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'dev.vsdeadshot.flashcards'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.vsdeadshot.flashcards'
        // java.time is available natively from 26, so the scheduler needs no desugaring and
        // the dates it computes are the same ones the backend computes.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'

        buildConfigField 'String', 'API_KEY',
                "\"${localProperties.getProperty('flashcards.apiKey', '')}\""
        // 10.0.2.2 is the emulator's alias for the host machine's loopback, so the default
        // reaches a backend started with bootRun and nothing has to be configured to try the
        // app. A real device needs a LAN address here and the same host added to the debug
        // network security config.
        buildConfigField 'String', 'BASE_URL',
                "\"${localProperties.getProperty('flashcards.baseUrl', 'http://10.0.2.2:8080/api/v1/')}\""

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes the schema as JSON here. It is committed, so a change to an
                // entity shows up as a diff in a schema file rather than only as a migration
                // someone remembered to write.
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        // Off by default since AGP 8. The generated BuildConfig is how the key and base URL
        // reach the code without being written down anywhere the repo can see.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric needs the merged resources and manifest to build an Application.
            includeAndroidResources = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // The scheduler the backend runs, verbatim. The client predicts a review's outcome
    // offline with it; the server's answer replaces the prediction at the next sync.
    implementation project(':scheduler')

    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    // The sync runs here rather than on a thread the app owns, so it survives the process being
    // killed and waits for a network instead of failing on one that is not there. Java-only rules
    // out the ktx artifacts; the base one is enough. It does pull kotlin-stdlib and the coroutines
    // runtime onto the classpath transitively — the Java constraint is on the source in this
    // repository, not on what a dependency happens to be written in. Its own room-runtime
    // requirement is 2.7.0, below the 2.8.4 pinned above, so the resolved version stays matched
    // to the annotation processor rather than being dragged out from under it.
    implementation 'androidx.work:work-runtime:2.11.2'

    // Retrofit 3 runs on OkHttp 5. Moshi rather than Gson: same maintainers as Retrofit and
    // OkHttp so the three versions move together, and it is the stricter reader of the two —
    // a JSON null where the DTO declares a primitive is refused rather than silently left at
    // zero, which is the difference between a schedule that fails loudly and one that quietly
    // resets. Its Kotlin codegen is not used; the DTOs are plain Java classes read reflectively.
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-moshi:3.0.0'
    implementation 'com.squareup.moshi:moshi:1.15.2'
    // Pinned explicitly, not left to Retrofit, which still declares OkHttp 4.12.0. MockWebServer
    // is 5.x, so without this line the tests would run against a different OkHttp than the app
    // shipped — the same objection this project has to testing against H2 and running on
    // Postgres. Verified by resolving both classpaths rather than assumed.
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    // The UI is XML views: Jetpack Compose is a Kotlin compiler plugin, so the Java-only rule
    // rules it out. AppCompat is what an activity extends; Material supplies the theme the
    // toolbar and the bottom bar are drawn against.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Three peer destinations need no more than a fragment swap, but the card list opens an
    // editor carrying a card id and wants a working up button, and hand-rolling that back stack
    // is the more expensive half of the choice.
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'

    // Declared rather than inherited: Room's LiveData support is compileOnly, so room-runtime
    // brings arch core-runtime and nothing else. Without these two lines LiveData is simply
    // absent from the classpath.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    // Runs the Android framework on the JVM, so the database tests need no emulator — the
    // same reason the backend runs Postgres in-process rather than asking for Docker.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    // A real HTTP server on a loopback port, so the remote tests exercise OkHttp, Retrofit and
    // Moshi rather than a stubbed interface — the same reason the database tests run real
    // SQLite. Those tests need no Android framework and so do not run under Robolectric.
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.4.0'
    // Runs a worker's doWork() on the spot and lets the scheduler's requests be read back out
    // of a WorkManager that never touches a real executor or a real alarm.
    testImplementation 'androidx.work:work-testing:2.11.2'
}
