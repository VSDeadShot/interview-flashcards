plugins {
    id 'com.android.application'
}

// The server's address is per-machine, and local.properties is gitignored. Reading it here is
// what lets a fresh clone point the app at its own backend without editing a tracked file.
//
// There is no longer a key to read. The credential is a bearer token obtained by signing in
// with a passphrase, held in the app's own storage and never built into the APK — which is the
// point of the change that removed it: a static key in a shipped binary is extractable by
// anyone holding the binary, and rotating it meant shipping a new build.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing, read from a gitignored keystore.properties beside local.properties. The
// keystore itself lives outside this repository: a file that is not in the tree cannot be
// committed by accident, and it has to outlive the working copy, because losing this key means
// never being able to update an app already installed from it.
//
// Absent on a fresh clone, and the build has to survive that — an unsigned release APK is a
// perfectly good outcome for somebody who has no keystore and is not shipping. What it must not
// do is fail obscurely, so the two ways of being half-configured are checked below and named.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missing.isEmpty()) {
        // Left blank rather than absent. Signing would otherwise fail deep inside AGP with a
        // message about a keystore password, which names the symptom and not the file to edit.
        throw new GradleException(
                "keystore.properties is missing values for ${missing.join(', ')}. " +
                        "Fill them in, or delete the file to build an unsigned release.")
    }
    if (!file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException(
                "keystore.properties points at ${keystoreProperties['storeFile']}, which does " +
                        "not exist. The keystore lives outside the repository, so a fresh " +
                        "clone will not have brought it with it.")
    }
}

android {
    namespace 'dev.vsdeadshot.flashcards'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.vsdeadshot.flashcards'
        // java.time is available natively from 26, so the scheduler needs no desugaring and
        // the dates it computes are the same ones the backend computes.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'

        // The deployed instance, over TLS, which is what the client's reason to exist now is.
        // Working against a local backend means setting flashcards.baseUrl to
        // http://10.0.2.2:8080/api/v1/ — the emulator's alias for the host's loopback, already
        // permitted by the debug network security config — since running one is a deliberate
        // act either way and the default should be the case that needs no setup at all.
        buildConfigField 'String', 'BASE_URL',
                "\"${localProperties.getProperty('flashcards.baseUrl', 'https://interview-flashcards.onrender.com/api/v1/')}\""

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes the schema as JSON here. It is committed, so a change to an
                // entity shows up as a diff in a schema file rather than only as a migration
                // someone remembered to write.
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        // Off by default since AGP 8. The generated BuildConfig is how the base URL reaches the
        // code without a machine-specific address being written down in a tracked file.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric needs the merged resources and manifest to build an Application.
            includeAndroidResources = true

            // Unmocked android.* methods return a default instead of throwing. Needed because
            // the remote and auth tests deliberately run without Robolectric — nothing in them
            // touches the framework except android.util.Log, which the data layer logs through
            // and which would otherwise throw and be reported as the class under test failing.
            //
            // The narrow claim this rests on: the setting only changes what happens where a stub
            // would have thrown, and nothing else in the suite reaches one. It is not a licence
            // to test framework code this way — anything that actually needs Android still runs
            // under Robolectric, which is every test that touches Room or a fragment.
            returnDefaultValues = true
        }
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }

            // v1 is JAR signing, and it is only consulted below API 24. minSdk is 26, so it
            // would sign every entry a second time to satisfy platforms this app already
            // refuses to install on. Off deliberately rather than by default.
            enableV1Signing false

            // The baseline every supported device verifies.
            enableV2Signing true

            // v3 is what makes key rotation possible at all. It is the only scheme that carries
            // a proof-of-rotation lineage, and the lineage has to be signed by the key being
            // rotated away from — so a build shipped without v3 can never rotate, and the key
            // becomes permanent the moment somebody installs it. Enabled now, while it is one
            // line, rather than discovered later when it is nothing at all.
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // Still off, and deliberately not switched on in the same change as signing. Moshi
            // reads the DTOs reflectively — they are plain Java classes with no codegen — so R8
            // renaming a field is the difference between `accessToken` and `a`, and every
            // response silently stops parsing. Room's entities and the Retrofit interface have
            // the same exposure. None of it is caught by the unit tests, which never run R8, so
            // turning this on needs keep rules and a run on a device, which is its own change.
            minifyEnabled false

            // Conditional, so a clone without a keystore still produces a release APK — unsigned,
            // which is honest, rather than failing the build for want of a key it was never
            // given.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // The scheduler the backend runs, verbatim. The client predicts a review's outcome
    // offline with it; the server's answer replaces the prediction at the next sync.
    implementation project(':scheduler')

    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    // The sync runs here rather than on a thread the app owns, so it survives the process being
    // killed and waits for a network instead of failing on one that is not there. Java-only rules
    // out the ktx artifacts; the base one is enough. It does pull kotlin-stdlib and the coroutines
    // runtime onto the classpath transitively — the Java constraint is on the source in this
    // repository, not on what a dependency happens to be written in. Its own room-runtime
    // requirement is 2.7.0, below the 2.8.4 pinned above, so the resolved version stays matched
    // to the annotation processor rather than being dragged out from under it.
    implementation 'androidx.work:work-runtime:2.11.2'

    // Retrofit 3 runs on OkHttp 5. Moshi rather than Gson: same maintainers as Retrofit and
    // OkHttp so the three versions move together, and it is the stricter reader of the two —
    // a JSON null where the DTO declares a primitive is refused rather than silently left at
    // zero, which is the difference between a schedule that fails loudly and one that quietly
    // resets. Its Kotlin codegen is not used; the DTOs are plain Java classes read reflectively.
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-moshi:3.0.0'
    implementation 'com.squareup.moshi:moshi:1.15.2'
    // Pinned explicitly, not left to Retrofit, which still declares OkHttp 4.12.0. MockWebServer
    // is 5.x, so without this line the tests would run against a different OkHttp than the app
    // shipped — the same objection this project has to testing against H2 and running on
    // Postgres. Verified by resolving both classpaths rather than assumed.
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    // The UI is XML views: Jetpack Compose is a Kotlin compiler plugin, so the Java-only rule
    // rules it out. AppCompat is what an activity extends; Material supplies the theme the
    // toolbar and the bottom bar are drawn against.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Three peer destinations need no more than a fragment swap, but the card list opens an
    // editor carrying a card id and wants a working up button, and hand-rolling that back stack
    // is the more expensive half of the choice.
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'

    // Declared rather than inherited. Material brings recyclerview at 1.2.1 transitively, and
    // the card list compiles against it directly — the same objection this file already makes to
    // letting Retrofit choose the OkHttp the tests run on.
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Declared rather than inherited: Room's LiveData support is compileOnly, so room-runtime
    // brings arch core-runtime and nothing else. Without these two lines LiveData is simply
    // absent from the classpath.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    // The press feedback every screen shares is a spring rather than a duration, so a quick tap
    // and a long press both feel answered. SpringAnimation lives here and nowhere else - neither
    // appcompat nor material brings it transitively, and the ObjectAnimator alternative would
    // have to guess a duration for a gesture whose length is not known when it starts.
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'

    // The unlock gate. Wraps the platform's fingerprint/face/PIN prompt behind one API that
    // works from 26 up, which the framework's own BiometricPrompt does not.
    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    // Runs the Android framework on the JVM, so the database tests need no emulator — the
    // same reason the backend runs Postgres in-process rather than asking for Docker.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    // A real HTTP server on a loopback port, so the remote tests exercise OkHttp, Retrofit and
    // Moshi rather than a stubbed interface — the same reason the database tests run real
    // SQLite. Those tests need no Android framework and so do not run under Robolectric.
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.4.0'
    // Runs a worker's doWork() on the spot and lets the scheduler's requests be read back out
    // of a WorkManager that never touches a real executor or a real alarm.
    testImplementation 'androidx.work:work-testing:2.11.2'
}
