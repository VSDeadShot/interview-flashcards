plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.vsdeadshot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Bcrypt, and nothing else. Deliberately the standalone artifact rather than
	// spring-boot-starter-security: the starter brings an entire filter chain and its
	// autoconfiguration, which would then have to be switched off to leave this application's
	// own filters in charge. This one resolves through the Boot BOM with no transitive
	// dependencies at all. The alternative was hand-rolling PBKDF2, which is thirty lines of
	// JDK and exactly the kind of thing a security review flags on sight.
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// A real PostgreSQL server, unpacked and run in-process for the duration of the
	// test JVM. Testcontainers would be the usual choice, but there is no Docker on
	// this machine. The point is that tests hit actual Postgres, so nothing passes in
	// an emulation and then fails in production on a dialect difference.
	testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
	testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.5.0')
}

tasks.named('test') {
	useJUnitPlatform()
}

// Prints the bcrypt hash to put in FLASHCARDS_PASSPHRASE_HASH. Reads the passphrase from
// standard input rather than from a command-line argument, which would be recorded in shell
// history and visible in the process list to anything running on the machine.
//
// It lives in the test source set so it cannot ship inside the deployed jar. A running server
// has no business carrying a tool that turns passphrases into hashes.
tasks.register('hashPassphrase', JavaExec) {
	group = 'application'
	description = 'Reads a passphrase from stdin and prints its bcrypt hash.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.vsdeadshot.flashcards.tools.PassphraseHashTool'
	standardInput = System.in
}
