spring.application.name=flashcards

# Loopback only, rather than Tomcat's default of every interface. This API authenticates with
# one static key and speaks plain HTTP, so binding it to 0.0.0.0 publishes both to whatever
# network the development machine happens to be attached to. The emulator is unaffected:
# 10.0.2.2 is its alias for the host's loopback, which is exactly what this still accepts.
#
# Overridable rather than hard-coded, because testing on a real device does need a reachable
# address here. That is a deliberate opt-in for one session, not the default posture.
server.address=${FLASHCARDS_BIND_ADDRESS:127.0.0.1}

# Local PostgreSQL 17. The password is read from the FLASHCARDS_DB_PASSWORD environment
# variable so no credential is ever committed. The app connects as the non-superuser
# `flashcards` role, which owns this database and nothing else.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/flashcards
spring.datasource.username=${FLASHCARDS_DB_USER:flashcards}
spring.datasource.password=${FLASHCARDS_DB_PASSWORD}

# The shared API key is deliberately NOT declared here. It binds straight from the
# FLASHCARDS_API_KEY environment variable — relaxed binding maps that name onto
# flashcards.api-key — so a missing one fails @NotBlank validation and the app refuses to
# start.
#
# Writing `flashcards.api-key=${FLASHCARDS_API_KEY}` would be worse than useless. Unlike
# @Value, @ConfigurationProperties binding does not fail on a placeholder it cannot resolve;
# it hands over the literal text. The app would boot happily with "${FLASHCARDS_API_KEY}" as
# its API key, which is non-blank, guessable, and identical on every machine.

# The owner every row is written under while there is one user. Not a secret, so it has a
# default; FLASHCARDS_USER_ID overrides it.
flashcards.user-id=local

# The zone every day boundary is computed in. Named here rather than taken from the host,
# because the host stops being the user's machine the moment this is deployed: a container
# runs UTC, and the study queue, the streak and the generation reset would all silently move
# to a day that is not the user's. See ClockConfiguration.
#
# A real default rather than a placeholder with none, so nothing has to be set to run this
# locally and a deployment inherits the same answer instead of drifting to whatever the
# platform's clock happens to say. FLASHCARDS_TIMEZONE overrides it.
flashcards.timezone=${FLASHCARDS_TIMEZONE:Asia/Kolkata}

# Makes Spring's own failures — malformed JSON, a missing parameter, a rejected @Valid —
# answer in application/problem+json, the same format ApiExceptionHandler uses for the
# service layer's exceptions. Off by default, and without it those return Boot's generic
# error body instead, so a client would need two parsers for one API.
spring.mvc.problemdetails.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns the schema outright. Hibernate only validates the entity mappings
# against it and is never allowed to create or alter a table.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The Gemini key binds from FLASHCARDS_GEMINI_API_KEY -- the whole prefix, not just GEMINI_API_KEY.
# The property is flashcards.gemini.api-key, so relaxed binding wants every segment of it. The
# analogy with FLASHCARDS_API_KEY does not carry: that property is flashcards.api-key, one level
# shallower, which is why the two names look inconsistent and are not.
#
# It is deliberately NOT declared here, for the same reason the shared key is not:
# @ConfigurationProperties binding does not fail on a placeholder it cannot resolve, it hands over
# the literal text.
#
# Unlike the shared key it is optional. Without it POST /cards/generate answers 503 and every
# other endpoint is unaffected -- generation is a capability, not a precondition, and requiring it
# would mean the application refuses to boot and every test context has to supply a key.
#
# The model is named here rather than in code so a rename is a configuration change. Both this
# and the fallback in GeminiProperties have to be moved together; a stale fallback is a
# default nobody would think to check.
flashcards.gemini.model=gemini-3.6-flash
