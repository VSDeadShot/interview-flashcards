spring.application.name=flashcards

# Local PostgreSQL 17. The password is read from the FLASHCARDS_DB_PASSWORD environment
# variable so no credential is ever committed. The app connects as the non-superuser
# `flashcards` role, which owns this database and nothing else.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/flashcards
spring.datasource.username=${FLASHCARDS_DB_USER:flashcards}
spring.datasource.password=${FLASHCARDS_DB_PASSWORD}

# The shared API key is deliberately NOT declared here. It binds straight from the
# FLASHCARDS_API_KEY environment variable — relaxed binding maps that name onto
# flashcards.api-key — so a missing one fails @NotBlank validation and the app refuses to
# start.
#
# Writing `flashcards.api-key=${FLASHCARDS_API_KEY}` would be worse than useless. Unlike
# @Value, @ConfigurationProperties binding does not fail on a placeholder it cannot resolve;
# it hands over the literal text. The app would boot happily with "${FLASHCARDS_API_KEY}" as
# its API key, which is non-blank, guessable, and identical on every machine.

# The owner every row is written under while there is one user. Not a secret, so it has a
# default; FLASHCARDS_USER_ID overrides it.
flashcards.user-id=local

# Makes Spring's own failures — malformed JSON, a missing parameter, a rejected @Valid —
# answer in application/problem+json, the same format ApiExceptionHandler uses for the
# service layer's exceptions. Off by default, and without it those return Boot's generic
# error body instead, so a client would need two parsers for one API.
spring.mvc.problemdetails.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns the schema outright. Hibernate only validates the entity mappings
# against it and is never allowed to create or alter a table.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
